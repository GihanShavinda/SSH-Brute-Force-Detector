# SSH / RDP Brute Force Detector (Windows) - Configuration

# Where to read failed-login events from:
#   "eventlog" -> Windows Security Event Log, Event ID 4625 (covers RDP,
#                 network logon, and OpenSSH-on-Windows when it authenticates
#                 via Windows accounts)
#   "logfile"  -> a plain text log file, e.g. OpenSSH's own sshd.log if you
#                 have configured it to log there (C:\ProgramData\ssh\logs\sshd.log)
log_source: "eventlog"

# Only used when log_source = "logfile"
log_file: "C:\\ProgramData\\ssh\\logs\\sshd.log"

# Only used when log_source = "eventlog". Restrict to certain logon types:
#   3  = Network (includes many SSH/SMB auth attempts)
#   10 = RemoteInteractive (RDP)
# Leave empty [] to match all failed-logon events regardless of type.
eventlog_logon_types: [3, 10]

detection:
  # Number of failed login attempts before an IP is banned
  max_failures: 5

  # Time window (seconds) in which those failures must occur
  window_seconds: 300

  # How long a ban lasts, in seconds (0 = permanent until manually unbanned)
  ban_duration_seconds: 3600

  # Never ban these IPs / networks (your own machine, office IP, VPN, etc.)
  whitelist:
    - "127.0.0.1"
    - "::1"
    # - "203.0.113.10"
    # - "10.0.0.0/8"

banning:
  # Windows Firewall rule name prefix used for banned IPs
  rule_prefix: "SSH_BF_BAN"

logging:
  app_log_file: "logs\\detector.log"
  ban_log_file: "logs\\banned_ips.log"
  level: "INFO"

notifications:
  enabled: false
  webhook_url: ""
